
# Serveur principal sur port 8080
server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost www.example.com;
    
    # Pages d'erreur personnalisées
    error_page 404 ./error_pages/404.html;
    error_page 405 ./error_pages/405.html;
    error_page 409 ./error_pages/405.html;
    error_page 500 ./error_pages/405.html;
    error_page 501 ./error_pages/405.html;
    error_page 504 ./error_pages/405.html;

    # Limite taille du body des requêtes (en bytes)
    clientMaxBodySize 10485760;  # 1MB
    
    # Route racine
    location / {
        root ./www;
        index index.html cgi.html post.html delete.html;
        allowedMethods GET POST;
        autoindex on;  # Listing des répertoires activé
    }
    
    # Route pour les fichiers statiques
    location /static {
        root /var/www;
        allowedMethods GET;
        autoindex off;
    }
    
    # Route avec redirection
    # location /redirect {
    #     return 301 https://www.google.com;
    # }
    
    # Route pour upload de fichiers
    location /upload {
        root /var/www/uploads;
        allowedMethods GET POST DELETE;
        uploadEnabled on;
        uploadStore /var/www/uploads/files/;
    }
    
    # Route pour CGI PHP
    location /cgi-bin {
        root /var/www/cgi-bin;
        allowedMethods GET POST;
        cgiExtension .php;
        cgiPath /usr/bin/php-cgi;
    }
    
    # Route pour scripts Python
    location /cgi-bin-python {
        root ./cgi_examples;
        allowedMethods GET POST;
        cgiExtension .py;
        cgiPath /usr/bin/python3;
    }
}

